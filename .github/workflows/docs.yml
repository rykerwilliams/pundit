name: docs

on:
  push:
    branches: [main]
  pull_request:

# `deploy` needs `pages` and `id-token`; `build` needs neither, but one
# workflow-level block is easier to read than two job-level ones, and `build` is
# the job that runs on a pull request.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and **never cancel one in flight**: a half-uploaded site
# is worse than a stale one. Pushes that land during a deploy queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned, and the version this book is known to build under: mdbook's HTML
  # output and its `SUMMARY.md` strictness both move between releases, and a site
  # that rebuilds itself differently on a Tuesday is not worth the freshness.
  # Bump it deliberately, with a local `mdbook build` first.
  MDBOOK_VERSION: 0.4.40

jobs:
  # **This job is the check, not the publish.** It runs on every pull request,
  # where `deploy` does not, because the failure it catches is a source-only
  # mistake: `book.toml` sets `create-missing = false`, so a `SUMMARY.md` entry
  # with no file behind it is a hard error, and a broken relative link between
  # pages is a dead link on a page someone is reading. Neither is visible from
  # the markdown. See BACKLOG #107 — the keyboard-shortcuts page shipped unbuilt
  # because nothing here existed yet.
  build:
    name: build the book
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The release tarball, not `cargo install`: seconds against minutes, and
      # no Rust toolchain on a job that does not otherwise need one.
      - name: Install mdbook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - run: mdbook build docs/book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

  # Only from `main`, so a pull request checks the book without publishing it.
  deploy:
    name: publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
